name: Capturar apertura MEP/CCL

on:
  schedule:
    # 9:00 hora Argentina (UTC-3, sin horario de verano) = 12:00 UTC, lunes a viernes.
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/capturar-apertura-mep-ccl.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/apertura-mep-ccl.json
          git diff --staged --quiet || git commit -m "Actualizar apertura diaria de MEP/CCL"
          git push
