name: Capturar cierre diario

on:
  # Disparado por un cronjob externo (cron-job.org) a las 00:15 hora Argentina, todos
  # los días -incluye fines de semana, así el front siempre puede leer "fecha = hoy -
  # 1" sin buscar el día hábil anterior-. Antes tenía también un "schedule:" nativo de
  # GitHub Actions de respaldo, pero se sacó a propósito: además de la demora errática
  # de varias horas que tiene el cron nativo en este repo (ver cachear-precios.yml,
  # que sí lo conserva porque ahí no importa), un disparo duplicado y tardío acá sí
  # rompía algo real -el dólar cripto opera las 24hs, así que una segunda corrida a la
  # mañana pisaba el "cierre de ayer" con el precio de ese momento en vez del cierre
  # real de medianoche, mientras que el resto de los instrumentos (mercado cerrado a
  # esa hora) no tenían este problema-.
  workflow_dispatch:

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - run: node scripts/capturar-cierre-diario.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
