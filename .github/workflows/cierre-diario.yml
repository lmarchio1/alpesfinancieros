name: Capturar cierre diario

on:
  # Disparado por un cronjob externo (cron-job.org) a las 00:15 hora Argentina, todos
  # los días -incluye fines de semana, así el front siempre puede leer "fecha = hoy -
  # 1" sin buscar el día hábil anterior-. Antes tenía también un "schedule:" nativo de
  # GitHub Actions de respaldo, pero se sacó a propósito: además de la demora errática
  # de varias horas que tiene el cron nativo en este repo (ver cachear-precios.yml,
  # que sí lo conserva porque ahí no importa), un disparo duplicado y tardío acá sí
  # rompía algo real -el dólar cripto opera las 24hs, así que una segunda corrida a la
  # mañana pisaba el "cierre de ayer" con el precio de ese momento en vez del cierre
  # real de medianoche, mientras que el resto de los instrumentos (mercado cerrado a
  # esa hora) no tenían este problema-.
  workflow_dispatch:

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - run: node scripts/capturar-cierre-diario.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Historia de 4 años para el gráfico del riesgo país. Va después del cierre y no lo
      # frena: si falla, el cierre ya quedó guardado y el gráfico sigue mostrando la
      # última versión buena.
      - run: node scripts/cachear-riesgo-pais.mjs
        # Corre aunque el cierre haya terminado en error (por ejemplo, sin MEP o CCL).
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Historia del índice dólar (DXY) para el gráfico de Divisas y Metales. Incremental:
      # la primera vez baja todo desde marzo de 2024 y después un día por noche. Igual que
      # el anterior, si falla no frena nada y el gráfico sigue con lo último guardado.
      - run: node scripts/cachear-dxy.mjs
        # Corre aunque el cierre haya terminado en error (por ejemplo, sin MEP o CCL).
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Tasa de la Fed (último dato, cambios de rango e historia de 4 años) desde la API
      # oficial de la Fed de Nueva York. Mismo criterio: si falla, no frena nada.
      - run: node scripts/cachear-fed.mjs
        # Corre aunque el cierre haya terminado en error (por ejemplo, sin MEP o CCL).
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Tipo de cambio real multilateral (ITCRM) del BCRA: solo se publica como Excel y sin
      # fecha fija, así que se revisa cada noche. Mismo criterio: si falla, no frena nada.
      - run: node scripts/cachear-itcrm.mjs
        # Corre aunque el cierre haya terminado en error (por ejemplo, sin MEP o CCL).
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Control final: si algún dato lleva más tiempo del normal sin actualizarse, este paso
      # falla, la corrida queda en rojo y llega el mail. Los pasos de arriba no avisan solos
      # (están hechos para no frenar el cierre), y una fuente puede dejar de actualizarse sin
      # que nada falle. Ver scripts/verificar-frescura.mjs.
      - run: node scripts/verificar-frescura.mjs
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
