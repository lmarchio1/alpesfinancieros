name: Capturar cierre diario

on:
  schedule:
    # 00:45 hora Argentina (UTC-3, sin horario de verano) = 03:45 UTC, todos los días
    # -incluye fines de semana, así el front siempre puede leer "fecha = hoy - 1" sin
    # tener que buscar el día hábil anterior: sábado y domingo simplemente re-guardan
    # el cierre del viernes-. Minuto no redondo a propósito: GitHub avisa que los cron
    # justo "en punto" (minuto 0) son los que más demora sufren por acumulación de
    # workflows programados a la misma hora en runners compartidos (se vio en vivo:
    # con minuto 0 corría 6-7hs tarde).
    - cron: '45 3 * * *'
  workflow_dispatch:

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - run: node scripts/capturar-cierre-diario.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
