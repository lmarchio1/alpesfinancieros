name: Cachear precios de bonos/letras

on:
  schedule:
    # Cada 5 minutos (el mínimo que permite GitHub Actions), todos los días. Es un
    # techo de frescura más bajo que el polling en vivo del navegador (60s) a
    # propósito: el objetivo es que la pestaña Renta Fija cargue más rápido al
    # abrirla, no una frescura al segundo -y esos datos ya están aclarados como "de
    # referencia" en el sitio-. Actualizar más seguido no hace más lenta la carga
    # para el visitante (siempre lee de Supabase igual de rápido); solo baja qué tan
    # viejo puede llegar a estar el precio en el peor caso.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  cachear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - run: node scripts/cachear-precios.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
